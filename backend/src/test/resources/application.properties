spring.application.name=backend
spring.profiles.active=local
google.maps.api.key=test-key
selenium.remote.url=http://localhost:4444/wd/hub

# In-memory datasource for tests (full Spring context tests, e.g. @SpringBootTest).
# Production always uses Postgres — see backend/docker-compose.yml and application.properties.
spring.datasource.url=jdbc:h2:mem:buybeacon;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

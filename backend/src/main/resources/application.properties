spring.application.name=backend
# 'local' profile loads application-local.properties (gitignored) which
# supplies google.maps.api.key. See application-local.properties.example.
#spring.profiles.active=local
server.address=0.0.0.0
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
selenium.remote.url=${SELENIUM_REMOTE_URL:http://localhost:4444/wd/hub}
openstreetmap.overpass.enabled=${OVERPASS_ENABLED:true}
openstreetmap.overpass.url=${OVERPASS_URL:https://overpass-api.de/api/interpreter}
# Keep the query local and bounded: the frontend only displays shops within 1 km,
# while a small buffer avoids gaps between 300 m location-based refreshes.
openstreetmap.overpass.radius-meters=${OVERPASS_RADIUS_METERS:2000}
openstreetmap.overpass.max-results=${OVERPASS_MAX_RESULTS:20}
openstreetmap.overpass.cache-seconds=${OVERPASS_CACHE_SECONDS:120}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/buybeacon}
spring.datasource.username=${DB_USERNAME:buybeacon}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
# Shared secret for the temporary DebugLogController (see its Javadoc). Empty
# by default -- the endpoint refuses all requests until this is set, since it
# has no other auth and the backend is publicly reachable via Cloudflare Tunnel.
debug.log.token=${DEBUG_LOG_TOKEN:}
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
